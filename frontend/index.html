<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Expense Tracker</h1>
    <div class="auth">
      <span id="userEmail" class="email"></span>
      <button id="loginBtn" class="btn">Log in / Sign up</button>
      <button id="logoutBtn" class="btn ghost hidden">Log out</button>
    </div>
  </header>

  <main>
    <section id="signedOut">
      <p class="muted">Sign in to view and manage your expenses.</p>
    </section>

    <section id="signedIn" class="hidden">
      <form id="expenseForm" class="card">
        <h2>Add expense</h2>
        <input id="title" placeholder="Title" required />
        <input id="amount" type="number" step="0.01" placeholder="Amount (₹)" required />
        <input id="category" placeholder="Category" />
        <input id="date" type="date" />
        <label class="field">Receipt (optional, max 5 MB)
          <input id="receipt" type="file" accept="image/*,application/pdf" />
        </label>
        <button class="btn" type="submit">Add</button>
      </form>

      <!-- Budget Settings -->
      <div class="card" style="margin-top: 16px;">
        <h2>Budget Settings</h2>
        <div style="display: flex; gap: 10px; align-items: center;">
          <label style="flex:1;">
            Monthly Budget (₹)
            <input id="budgetInput" type="number" step="0.01" min="0" placeholder="e.g. 5000" />
          </label>
          <button id="saveBudgetBtn" class="btn">Save</button>
          <span id="budgetStatus" class="muted" style="font-size:13px;"></span>
        </div>
      </div>

      <div id="status" class="muted"></div>
      <button id="exportBtn" class="btn ghost" style="margin: 8px 0;">Export CSV</button>
      <label class="btn ghost file" style="margin: 8px 0 8px 8px;">Import CSV
        <input id="importInput" type="file" hidden accept=".csv,text/csv" />
      </label>
      <ul id="list" class="list"></ul>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
