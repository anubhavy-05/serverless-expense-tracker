AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Expense Tracker - Phase 1 Foundation + Phase 2 Receipts + Budget Alerts (user‑defined)

Parameters:
  StageName:
    Type: String
    Default: prod
    Description: API Gateway stage name
  AlarmEmail:
    Type: String
    Description: Email address to receive CloudWatch alarm and budget notifications
  CallbackUrl:
    Type: String
    Default: http://localhost:5500/index.html
    Description: Where Cognito Hosted UI returns after login (update after CloudFront)
  DefaultBudget:
    Type: Number
    Default: 500
    Description: Fallback monthly budget if user hasn't set one

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 128
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref ExpensesTable
        EXPENSES_TABLE: !Ref ExpensesTable
        SETTINGS_TABLE: !Ref UserSettingsTable
        LOG_LEVEL: INFO

Resources:

  # ── Cognito ──────────────────────────────────────────────
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: expense-tracker-users
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      AllowedOAuthFlowsUserPoolClient: true
      SupportedIdentityProviders: [COGNITO]
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
      CallbackURLs:
        - !Ref CallbackUrl
      LogoutURLs:
        - !Ref CallbackUrl

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub 'expense-tracker-${AWS::AccountId}'
      UserPoolId: !Ref UserPool

  # ── DynamoDB tables ──────────────────────────────────────
  ExpensesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ExpenseTracker
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: expenseId
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: expenseId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: UserDateIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: date
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  UserSettingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: UserSettings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  # ── API Gateway ──────────────────────────────────────────
  ExpenseApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref StageName
      TracingEnabled: true
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn

  # ── CRUD Lambdas ──────────────────────────────────────────
  CreateExpenseFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: create.lambda_handler
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref ExpensesTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ExpenseApi
            Path: /expenses
            Method: POST

  ListExpensesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: list.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ExpensesTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ExpenseApi
            Path: /expenses
            Method: GET

  GetExpenseFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: get.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ExpensesTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ExpenseApi
            Path: /expenses/{expenseId}
            Method: GET

  UpdateExpenseFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: update.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ExpensesTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ExpenseApi
            Path: /expenses/{expenseId}
            Method: PUT

  DeleteExpenseFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: delete.lambda_handler
      Environment:
        Variables:
          RECEIPTS_BUCKET: !Ref ReceiptsBucket
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref ExpensesTable
        - Statement:
            - Effect: Allow
              Action: dynamodb:DeleteItem
              Resource: !GetAtt ExpensesTable.Arn
        - Statement:
            - Effect: Allow
              Action: s3:DeleteObject
              Resource: !Sub '${ReceiptsBucket.Arn}/users/*'
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ExpenseApi
            Path: /expenses/{expenseId}
            Method: DELETE

  # ── Receipts ──────────────────────────────────────────────
  ReceiptsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'expense-tracker-receipts-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, PUT, HEAD]
            AllowedOrigins: ['*']
            AllowedHeaders: ['*']
            ExposedHeaders: [ETag]
            MaxAge: 3000

  ReceiptUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: receipts.upload_handler
      Environment:
        Variables:
          RECEIPTS_BUCKET: !Ref ReceiptsBucket
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ExpensesTable
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub '${ReceiptsBucket.Arn}/users/*'
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ExpenseApi
            Path: /expenses/{expenseId}/receipt-url
            Method: POST

  ReceiptDownloadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: receipts.download_handler
      Environment:
        Variables:
          RECEIPTS_BUCKET: !Ref ReceiptsBucket
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ExpensesTable
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub '${ReceiptsBucket.Arn}/users/*'
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ExpenseApi
            Path: /expenses/{expenseId}/receipt-url
            Method: GET

  # ── Settings (user-defined budget) ──────────────────────
  GetSettingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: settings.get_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UserSettingsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ExpenseApi
            Path: /settings
            Method: GET

  UpdateSettingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: settings.update_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserSettingsTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ExpenseApi
            Path: /settings
            Method: PUT

  # ── Budget Alert (scheduled) ────────────────────────────
  BudgetAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: expense-budget-alerts

  BudgetAlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref BudgetAlertTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  BudgetAlertFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: budget.lambda_handler
      Runtime: python3.12
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          EXPENSES_TABLE: !Ref ExpensesTable
          SETTINGS_TABLE: !Ref UserSettingsTable
          BUDGET_TOPIC_ARN: !Ref BudgetAlertTopic
          DEFAULT_BUDGET: !Ref DefaultBudget
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ExpensesTable
        - DynamoDBReadPolicy:
            TableName: !Ref UserSettingsTable
        - Statement:
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref BudgetAlertTopic
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 9 * * ? *)
            Description: Daily budget check

  TrendAggregatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: trend.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ExpensesTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ExpenseApi
            Path: /chart/trend
            Method: GET

  SankeyAggregatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: sankey.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ExpensesTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ExpenseApi
            Path: /chart/sankey
            Method: GET

  AnomalyDetectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: anomaly.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ExpensesTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ExpenseApi
            Path: /alert/anomalies
            Method: GET

  # ── Observability ────────────────────────────────────────
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: expense-tracker-alarms

  AlarmSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  CreateFunctionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: CreateExpenseFunction is erroring
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref CreateExpenseFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions: [!Ref AlarmTopic]
      TreatMissingData: notBreaching

  ListFunctionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: ListExpensesFunction is erroring
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ListExpensesFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions: [!Ref AlarmTopic]
      TreatMissingData: notBreaching

  UpdateFunctionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: UpdateExpenseFunction is erroring
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref UpdateExpenseFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions: [!Ref AlarmTopic]
      TreatMissingData: notBreaching

  DeleteFunctionErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: DeleteExpenseFunction is erroring
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref DeleteExpenseFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions: [!Ref AlarmTopic]
      TreatMissingData: notBreaching

Outputs:
  ApiUrl:
    Description: Base URL for the Expenses API
    Value: !Sub 'https://${ExpenseApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/expenses'
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  HostedUIDomain:
    Description: Cognito Hosted UI base domain
    Value: !Sub 'https://expense-tracker-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com'
  ReceiptsBucketName:
    Value: !Ref ReceiptsBucket
  BudgetAlertTopicArn:
    Value: !Ref BudgetAlertTopic